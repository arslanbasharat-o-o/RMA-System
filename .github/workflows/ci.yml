name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_browser_suite:
        description: Run the full desktop and mobile Playwright suite
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      full_browser_suite:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rma_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rma_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:ci-only@127.0.0.1:5432/rma_ci
      LENS_PROVIDER: mock
      APP_URL: http://localhost:3000
      INITIAL_ADMIN_EMAIL: admin@rma-system.local
      BUSINESS_TIMEZONE: UTC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Generate per-run test secrets
        run: |
          node -e "const c=require('node:crypto'); console.log('INITIAL_ADMIN_PASSWORD='+c.randomBytes(32).toString('base64url')); console.log('E2E_TEST_PASSWORD='+c.randomBytes(32).toString('base64url')); console.log('SESSION_SECRET='+c.randomBytes(32).toString('base64url'))" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run db:migrate
        env:
          NODE_ENV: test
      - run: npm run db:seed
        env:
          NODE_ENV: test
      - run: npm run test:fixtures
        env:
          NODE_ENV: test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
        env:
          NODE_ENV: test
      - run: npm run build
        env:
          NODE_ENV: production
      - name: Build the production runtime image without publishing
        run: |
          APP_VERSION="$(node -e 'process.stdout.write(JSON.parse(require("node:fs").readFileSync("release.json")).version)')"
          docker build --target runner \
            --build-arg APP_VERSION="$APP_VERSION" \
            --build-arg VCS_REF="$GITHUB_SHA" \
            --build-arg NEXT_PUBLIC_APP_COMMIT="$GITHUB_SHA" \
            --tag rma-system:ci .
          test "$(docker image inspect rma-system:ci --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
          test "$(docker image inspect rma-system:ci --format '{{index .Config.Labels "org.opencontainers.image.version"}}')" = "$APP_VERSION"
          test "$(docker image inspect rma-system:ci --format '{{index .Config.Labels "org.opencontainers.image.source"}}')" = "https://github.com/arslanbasharat-o-o/RMA-System"
          test "$(docker image inspect rma-system:ci --format '{{index .Config.Labels "org.opencontainers.image.description"}}')" = "The RMA System web app helps repair teams manage customer returns, display intake, inspection photos, and staff review."
          test "$(docker image inspect rma-system:ci --format '{{index .Config.Labels "org.opencontainers.image.licenses"}}')" = "MIT"
          docker run --rm --entrypoint sh rma-system:ci -c 'test ! -e /app/.env && test ! -e /app/.env.local && test -z "$(find /app/data/storage -mindepth 1 -print -quit)"'
          docker build --target worker \
            --build-arg APP_VERSION="$APP_VERSION" \
            --build-arg VCS_REF="$GITHUB_SHA" \
            --tag rma-system-worker:ci .
          test "$(docker image inspect rma-system-worker:ci --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
          test "$(docker image inspect rma-system-worker:ci --format '{{index .Config.Labels "org.opencontainers.image.version"}}')" = "$APP_VERSION"
          test "$(docker image inspect rma-system-worker:ci --format '{{index .Config.Labels "org.opencontainers.image.source"}}')" = "https://github.com/arslanbasharat-o-o/RMA-System"
          test "$(docker image inspect rma-system-worker:ci --format '{{index .Config.Labels "org.opencontainers.image.description"}}')" = "The RMA System worker processes display photos and prepares model and vendor suggestions for staff review."
          test "$(docker image inspect rma-system-worker:ci --format '{{index .Config.Labels "org.opencontainers.image.licenses"}}')" = "MIT"
          docker run --rm --entrypoint sh rma-system-worker:ci -c 'test ! -e /app/.env && test ! -e /app/.env.local && test -z "$(find /app/data/storage -mindepth 1 -print -quit)"'
      - name: Install browsers for offline mobile checks
        run: npx playwright install --with-deps chromium webkit
      - name: Verify camera and customer intake on desktop and mobile
        if: ${{ !inputs.full_browser_suite }}
        run: npx playwright test e2e/camera-intake.spec.ts e2e/live-recognition.spec.ts --project=chromium --project=mobile-chrome
      - name: Verify Safari camera and live result updates
        run: npx playwright test e2e/camera-intake.spec.ts e2e/live-recognition.spec.ts --project=mobile-safari
      - name: Run the full browser suite for release validation
        if: inputs.full_browser_suite
        run: npx playwright test --project=chromium --project=mobile-chrome
